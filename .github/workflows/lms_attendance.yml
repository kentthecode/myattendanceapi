name: El Pirata LMS Auto Attendance

on:
  schedule:
    - cron: '55 0 * * 2,4'
    - cron: '25 6 * * 2,4'
  workflow_dispatch:
    inputs:
      max_run_minutes:
        description: 'Maximum minutes to stay active (default: 200)'
        required: false
        default: '200'

concurrency:
  group: lms-attendance-bsit-3b
  cancel-in-progress: false

jobs:
  attend-class:
    runs-on: ubuntu-latest
    timeout-minutes: 215
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies & Playwright Chromium
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run LMS Attendance Bot
        env:
          LMS_USERNAME: ${{ secrets.LMS_USERNAME }}
          LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}
          MAX_RUN_MINUTES: ${{ github.event.inputs.max_run_minutes || '200' }}
        run: python attendance_bot.py
