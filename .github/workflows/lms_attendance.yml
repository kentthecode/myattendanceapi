name: El Pirata LMS Auto Attendance

on:
  schedule:
    - cron: '*/20 0-9 * * 2,4'
  workflow_dispatch:
    inputs:
      max_run_minutes:
        description: 'Maximum minutes to stay active (default: 320)'
        required: false
        default: '320'

permissions:
  actions: write
  contents: read

concurrency:
  group: lms-attendance-bsit-3b
  cancel-in-progress: false

jobs:
  attend-class:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python dependencies & Playwright Chromium
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Run LMS Attendance Bot
        env:
          LMS_USERNAME: ${{ secrets.LMS_USERNAME }}
          LMS_PASSWORD: ${{ secrets.LMS_PASSWORD }}
          MAX_RUN_MINUTES: ${{ github.event.inputs.max_run_minutes || '320' }}
        run: python attendance_bot.py
      - name: Auto-Chain Afternoon Session if School Day Not Finished
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import subprocess; from datetime import datetime, timedelta, timezone; now = datetime.now(timezone(timedelta(hours=8))); subprocess.run(['gh', 'workflow', 'run', 'lms_attendance.yml', '--ref', 'main']) if (now.hour < 17 or (now.hour == 17 and now.minute < 25)) else None"
